    en: unknown
    zh: 未知
    meaning: No reliable observation or memory statement is available.
  - id: S_NOT_OBSERVABLE
    en: not_observable
    zh: 不可观察
    meaning: The feature may exist but image/pose/occlusion/quality prevents observation.
  - id: S_NOT_APPLICABLE
    en: not_applicable
    zh: 不适用
    meaning: The field does not apply to the case or component.
  - id: S_PRESENT
    en: present
    zh: 存在
    meaning: The feature is explicitly observed or reported, with evidence status recorded separately.
  - id: S_ABSENT
    en: absent
    zh: 未见
    meaning: Absence is recorded only when the feature was observable and the observation supports it.
